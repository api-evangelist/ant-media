specification: API Commons Packages
specificationVersion: '0.1'
provider: Ant Media
providerId: ant-media
generated: '2026-09-02'
method: searched
source: >-
  Registry metadata read unauthenticated from registry.npmjs.org, pub.dev/api/packages,
  search.maven.org/solrsearch and the GitHub API for the ant-media organization, cross-checked
  against https://docs.antmedia.io/guides/developer-sdk-and-api/sdk-integration/
description: >-
  First-party Ant Media client SDKs and distribution packages. Ant Media Server itself is
  self-hosted software, so the server artifacts (Maven io.antmedia:ant-media-server, the
  Community Edition ZIP on GitHub Releases) sit alongside the browser and mobile SDKs that
  talk to a running server over WebRTC and the REST API.
note: >-
  CURRENCY SIGNAL — the server releases 3.1.0 (2026-08-31) while several first-party SDKs
  trail well behind it: the JavaScript WebRTC adaptor is pinned at 2.16.2 (2025-12-08), the
  Android framework published to Maven Central is 2.11.1 (2024-10-21) even though the SDK
  repository is tagged v2.17.2, the iOS SDK's newest tag is v2.10.0 (2024-07-11), and the
  Maven server artifact is 2.14.0 (2025-05-13). The Android and iOS SDKs are effectively
  distributed by git tag / Swift Package Manager rather than by a package registry, which is
  why their registry versions understate what is actually shipping.
