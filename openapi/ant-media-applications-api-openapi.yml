openapi: 3.2.0
info:
  title: Ant Media Server Management Panel REST Applications API
  description: Ant Media Server Management Panel REST API
  contact:
    name: Ant Media Info
    url: https://antmedia.io
    email: contact@antmedia.io
  license:
    name: Apache 2.0
    url: http://www.apache.org
  version: v2.0
tags:
- name: Applications
paths:
  /v2/applications/settings/{appname}:
    get:
      summary: Returns the specified application settings
      operationId: getSettings
      parameters:
      - name: appname
        in: path
        description: Application name
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Application settings returned
      tags:
      - Applications
    post:
      summary: Changes the application settings
      operationId: changeSettings
      parameters:
      - name: appname
        in: path
        description: Application name
        required: true
        schema:
          type: string
      requestBody:
        description: New application settings, null fields will be set to default values
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppSettings'
        required: true
      responses:
        '200':
          description: Successful operation
      tags:
      - Applications
  /v2/applications/{appName}:
    put:
      summary: Creates a new application with given name and supports uploading custom WAR…
      operationId: createApplication_1
      parameters:
      - name: appName
        in: path
        description: Name for the new application
        required: true
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              required:
              - file
              type: object
              properties:
                file:
                  type: object
                  description: file
      responses:
        '200':
          description: Custom application created successfully
      tags:
      - Applications
    post:
      summary: Creates a new application with given name
      operationId: createApplication
      parameters:
      - name: appName
        in: path
        description: Name for the new application
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Application created successfully
      tags:
      - Applications
    delete:
      summary: Deletes application with the given name
      operationId: deleteApplication
      parameters:
      - name: appName
        in: path
        description: Name of the application to delete
        required: true
        schema:
          type: string
      - name: deleteDB
        in: query
        description: Whether to delete associated database
        required: true
        schema:
          type: boolean
      responses:
        '200':
          description: Application deleted successfully
      tags:
      - Applications
  /v2/applications/live-streams/{appname}:
    get:
      summary: Returns live streams in the specified application
      operationId: getAppLiveStreams
      parameters:
      - name: appname
        in: path
        description: Application name
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful operation
      tags:
      - Applications
  /v2/applications/{appName}/metrics-history:
    get:
      summary: Gets recent per-application metric history (viewers, live streams)
      operationId: getAppMetricsHistory
      parameters:
      - name: appName
        in: path
        description: Application name
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful operation
      tags:
      - Applications
  /v2/applications:
    get:
      summary: Gets the applications in the server
      operationId: getApplications
      responses:
        '200':
          description: Successful operation
      tags:
      - Applications
  /v2/applications/{appname}/reset:
    post:
      summary: Resets the viewer counts and broadcasts statuses in the db
      operationId: resetBroadcast
      parameters:
      - name: appname
        in: path
        description: Application name
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Broadcasts reset successfully
      tags:
      - Applications
