openapi: 3.2.0
info:
  title: Ant Media Server Management Panel REST Server Settings API
  description: Ant Media Server Management Panel REST API
  contact:
    name: Ant Media Info
    url: https://antmedia.io
    email: contact@antmedia.io
  license:
    name: Apache 2.0
    url: http://www.apache.org
  version: v2.0
tags:
- name: Server Settings
paths:
  /v2/server-settings:
    get:
      summary: Returns the server settings
      operationId: getServerSettings
      responses:
        '200':
          description: Server settings returned
      tags:
      - Server Settings
    post:
      summary: Changes server settings
      operationId: changeServerSettings
      requestBody:
        description: Server settings
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServerSettings'
        required: true
      responses:
        '200':
          description: Server settings changed
      tags:
      - Server Settings
components:
  schemas:
    Environment:
      type: object
      properties:
        activeProfiles:
          type: array
          items:
            type: string
        defaultProfiles:
          type: array
          items:
            type: string
    ServerSettings:
      type: object
      properties:
        allowedDashboardCIDR:
          type: string
        hostAddress:
          type: string
        serverName:
          type: string
        licenceKey:
          type: string
        buildForMarket:
          type: boolean
        marketplace:
          type: string
        logLevel:
          type: string
        offlineLicense:
          type: boolean
        nativeLogLevel:
          type: string
        heartbeatEnabled:
          type: boolean
        useGlobalIp:
          type: boolean
        proxyAddress:
          type: string
        nodeGroup:
          type: string
        cpuMeasurementPeriodMs:
          type: integer
          format: int32
        cpuMeasurementWindowSize:
          type: integer
          format: int32
        metricsHistorySamplePeriodMs:
          type: integer
          format: int32
        metricsHistorySize:
          type: integer
          format: int32
        appMetricsHistorySamplePeriodMs:
          type: integer
          format: int32
        appMetricsHistorySize:
          type: integer
          format: int32
        streamMetricsHistorySize:
          type: integer
          format: int32
        defaultHttpPort:
          type: integer
          format: int32
        jwtServerControlEnabled:
          type: boolean
        jwtServerSecretKey:
          type: string
        jwksURL:
          type: string
        originServerPort:
          type: integer
          format: int32
        srtPort:
          type: integer
          format: int32
        appIngestsSrtStreamsWithoutStreamId:
          type: string
        sslEnabled:
          type: boolean
        rtmpPort:
          type: integer
          format: int32
        serverStatusWebHookURL:
          type: string
        localLicenceServerIps:
          type: string
        applicationContext:
          $ref: '#/components/schemas/ApplicationContext'
        hostAddressFromEnvironment:
          type: string
        webRTCLogLevel:
          type: string
          enum:
          - LS_VERBOSE
          - LS_INFO
          - LS_WARNING
          - LS_ERROR
          - LS_NONE
        rtmpsEnabled:
          type: boolean
          writeOnly: true
    ApplicationContext:
      type: object
      properties:
        parent:
          $ref: '#/components/schemas/ApplicationContext'
        id:
          type: string
        displayName:
          type: string
        startupDate:
          type: integer
          format: int64
        applicationName:
          type: string
        autowireCapableBeanFactory:
