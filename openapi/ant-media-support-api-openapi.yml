openapi: 3.2.0
info:
  title: Ant Media Server Management Panel REST Support API
  description: Ant Media Server Management Panel REST API
  contact:
    name: Ant Media Info
    url: https://antmedia.io
    email: contact@antmedia.io
  license:
    name: Apache 2.0
    url: http://www.apache.org
  version: v2.0
tags:
- name: Support
paths:
  /v2/support/request:
    post:
      operationId: sendSupportRequest
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupportRequest'
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
      tags:
      - Support
      summary: Send support request
      x-summary-source: derived
components:
  schemas:
    SupportRequest:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        title:
          type: string
        description:
          type: string
        sendSystemInfo:
          type: boolean
    Result:
      type: object
      properties:
        success:
          type: boolean
          description: The result of the operation
        message:
          type: string
          description: The message of the operation result
        dataId:
          type: string
          description: The id of the record if operation is about adding a record
        errorId:
          type: integer
          description: The id of error of the operation result
          format: int32
      description: The basic result class
externalDocs:
  description: External Docs
  url: https://antmedia.io
