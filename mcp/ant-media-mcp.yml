  note: >-
    No hosted endpoint and no stdio package. Any future server would be per-instance, since
    Ant Media Server is self-hosted: the endpoint would live on the customer's own host and the
    credential would be the instance's JWT secret, not a vendor-issued key.
candidate_tools:
